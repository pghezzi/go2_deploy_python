default_angles: [0.,  0.8,  -1.5,  0., 0.8, -1.5, 
                  0.0,  0.8,  -1.5,  0., 0.8, -1.5]
sit_angles: [0.04, 1.3, -2.87, -0.02, 1.29, -2.86,
          -0.33, 1.27, -2.81, 0.32, 1.28, -2.87]

ang_vel_scale: 0.25
dof_pos_scale: 1.0
dof_vel_scale: 0.05
action_scale: 0.25

cmd_scale: [1.0, 1.0, 0.25]
num_actions: 12
